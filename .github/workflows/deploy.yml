name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: false
      - name: npm ci (debug via annotations)
        run: |
          code=0
          npm ci > npm-ci.log 2>&1 || code=$?
          if [ "$code" -ne 0 ]; then
            tail -n 50 npm-ci.log | while IFS= read -r l; do echo "::error::${l:0:250}"; done
            exit "$code"
          fi
      - run: npm run lint
      - run: npm run format:check
      - run: npx ng build --base-href /jte-test/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/jte-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
