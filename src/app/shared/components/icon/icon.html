@switch (imageType) {
  @case ('svg') {
    @if (svgAttributes) {
      <svg
        class="svg"
        xmlns="http://w3.org"
        [innerHTML]="svgAttributes.safeHtml"
        [attr.viewBox]="svgAttributes.viewBox"
        fill="none"
      ></svg>
    }
  }
  @case ('imageUrl') {
    <img class="image" [src]="imageSource" alt="" />
  }
}
