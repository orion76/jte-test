@if (items().length > 0) {
  <div class="menu" [class.menu--vertical]="direction() === 'vertical'">
    @for (item of items(); track item.id) {
      <app-menu-item
        [class]="'menu-item ' + 'menu-item--' + item.id"
        [itemData]="item"
        (itemClick)="onClick(item)"
      />
    }
  </div>
}
