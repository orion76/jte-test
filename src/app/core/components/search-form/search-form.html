<div
  class="search-form__header"
>
  <div class="form-field form-field--search">
    <input
      type="text"
      class="form-field__input"
      placeholder="Поиск"
      (focus)="onSearchFieldFocus()"
      [value]="query()"
      (input)="query.set($any($event.target).value)"
    />
    @if (query()) {
      <button
        app-icon="cancel"
        icon-position="after"
        type="button"
        class="form-field__clear"
        (click)="query.set('')"
        aria-label="Очистить"
      ></button>
    }
  </div>
</div>
@if (isShowForm()) {
  <app-filter-panel class="filter-panel" [(history)]="history" [checkboxStyle]="checkboxStyle()" />
}
