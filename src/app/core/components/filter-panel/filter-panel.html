<div class="filter-panel">
  <div class="filter-panel__layout">
    <div class="filter-panel__column filter-panel__column--history">
      <div class="filter-section">
        <div class="filter-section__header">История</div>
        @for (item of historyItems; track item) {
          <div class="filter-list-item">{{ item }}</div>
        }
        <div class="filter-section__gradient"></div>
      </div>
    </div>

    <div class="filter-panel__divider"></div>

    <div class="filter-panel__column filter-panel__column--filters">
      <div class="filter-field">
        <label class="filter-field__label">Автор</label>
        <div class="filter-field__input-wrapper">
          <input type="text" class="filter-field__input" placeholder="Имя или должность" />
          <button class="filter-field__me-btn">
            <span class="filter-field__me-bg"></span>
            <span class="filter-field__me-text">Я</span>
          </button>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-chips">
          @for (item of ['Я участник', 'Строгий поиск', 'В заголовках']; track item) {
            <label class="filter-chip">
              <input type="checkbox" class="filter-chip__checkbox" />
              <span class="filter-chip__label">{{ item }}</span>
            </label>
          }
        </div>
      </div>
      <div class="filter-section">
        <div class="filter-section__header filter-section__header--label">Только</div>
        <div class="filter-chips">
          @for (item of ['Теги', 'Просьбы', 'Контакты']; track item) {
            <label class="filter-chip">
              <input type="checkbox" class="filter-chip__checkbox" />
              <span class="filter-chip__label">{{ item }}</span>
            </label>
          }
        </div>
      </div>
    </div>
  </div>
</div>
